name: ublue-niri
description: Minimal Fedora Intel laptop with Niri + Noctalia
base-image: quay.io/fedora/fedora-bootc
image-version: 44

modules:
  - type: copy
    src:  files/certs/cosign.pub
    dest: /etc/pki/containers/cosign.pub

  - type: copy
    src:  files/containers/registries.d/ghcr.yaml
    dest: /etc/containers/registries.d/ghcr.yaml

  - type: signing

  - type: dnf
    repos:
      cleanup: true
      copr:
        - atim/starship
        - yalter/niri-git
        - zhangyi6324/noctalia-shell
        - brycensranch/gpu-screen-recorder-git
      files: 
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://repo.librewolf.net/librewolf.repo
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
    install:
      skip-unavailable: true
      packages:
        - niri
        - noctalia-shell
        - xwayland-run
        - alacritty
        - nautilus
        - flatpak
        - neovim

        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - greetd
        - cage
        - gtkgreet
        
        - iwlwifi-mvm-firmware
        - alsa-sof-firmware
        - alsa-ucm
        - tuned
        - tuned-ppd

        - gvfs-mtp

        - wget
        - git
        - mtr
        - rsync
        - wpa_supplicant
        - NetworkManager-wifi

        - glibc-langpack-en
        - glibc-langpack-ru
        - google-noto-sans-vf-fonts
        - google-noto-sans-mono-vf-fonts
        - google-noto-serif-vf-fonts
        - google-noto-color-emoji-fonts

        - wl-clipboard
        - distrobox
        - alsa-firmware
        - polkit
        - dbus-tools
        - dbus-daemon
        - qt5-wayland
        - qt6-wayland
        - wireplumber
        - pipewire
        - pulseaudio-utils
        - network-manager-applet
        - NetworkManager-openvpn
        - NetworkManager-openvpn-gnome
        - NetworkManager-openconnect
        - NetworkManager-openconnect-gnome
        - bluez
        - bluez-tools
        - blueman
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive
        - heif-pixbuf-loader
        - ffmpeg
        - ffmpeg-libs
        - ffmpegthumbnailer
        - pipewire-libs-extra
        - libfdk-aac
        - gstreamer1-plugins-bad
        - gstreamer1-plugins-ugly 
        - gnome-keyring
        - luajit
        - luajit-devel
        - dconf
        - dconf-editor
        - gsettings-desktop-schemas
        - mullvad
        - micro
        - starship
        - swww
        - swaync
        - greetd-selinux
        - xwayland-satellite
        - adw-gtk3-theme
        - xdg-desktop-portal-gnome
